name: R CMD check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'downloads/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Install PDF manual fonts
        shell: Rscript {0}
        run: |
          if (.Platform$OS.type == "windows") {
            texbin <- file.path(Sys.getenv("APPDATA"), "TinyTeX", "bin", "windows")
            stopifnot(file.exists(file.path(texbin, "pdflatex.exe")))
            Sys.setenv(PATH = paste(texbin, Sys.getenv("PATH"), sep = .Platform$path.sep))
            cat(texbin, file = Sys.getenv("GITHUB_PATH"), sep = "\n", append = TRUE)
            tlmgr <- file.path(texbin, "tlmgr.bat")
          } else {
            tlmgr <- Sys.which("tlmgr")
          }
          stopifnot(nzchar(tlmgr))
          status <- system2(shQuote(tlmgr), c("install", "inconsolata", "helvetic", "times", "makeindex", "fancyvrb", "fancyhdr", "upquote"))
          stopifnot(status == 0L)
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'character()'
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: 'true'
          artifact-name: ${{ matrix.os }}-R-CMD-check
